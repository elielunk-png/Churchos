<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChurchOS</title>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#1b1f2a;--mu:#667085;--pr:#3b4fd8;--ok:#12805c;--bad:#c62828;--wr:#b26a00;--bd:#e3e6ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--cd:#1c1f28;--tx:#eceef3;--mu:#9aa3b5;--pr:#8b9bff;--ok:#4cc79a;--bad:#ff7b7b;--wr:#ffb454;--bd:#2b3040;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141a;--cd:#1c1f28;--tx:#eceef3;--mu:#9aa3b5;--pr:#8b9bff;--ok:#4cc79a;--bad:#ff7b7b;--wr:#ffb454;--bd:#2b3040;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}
nav button{white-space:nowrap}
nav .on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{padding:0 12px 40px;max-width:760px;margin:auto}
.card,.k{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{cursor:pointer;margin:0}.k b{font-size:22px;display:block}.k span{color:var(--mu);font-size:13px}
button,input,select{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-width:100%}
button{cursor:pointer}.p{background:var(--pr);color:#fff;border-color:var(--pr)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.row input{flex:1;min-width:110px}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.wr{color:var(--wr)}
details{border-bottom:1px solid var(--bd);padding:6px 0}summary{cursor:pointer}
.qr svg{width:150px;height:150px}
#cam{position:relative;background:#000;border-radius:10px;overflow:hidden;min-height:120px}
#cam video{width:100%;display:block;max-height:300px;object-fit:cover}
#cam:after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:#f33;box-shadow:0 0 8px #f33;animation:sc 1.4s ease-in-out infinite alternate}
@keyframes sc{from{top:20%}to{top:80%}}
#fl{position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;font-weight:700;color:#fff;background:#444}
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.kb .card{padding:8px;font-size:13px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cards .card{text-align:center}
header{background:linear-gradient(135deg,#3b4fd8,#7b3fd1);color:#fff;padding:18px 16px 30px;border-radius:0 0 24px 24px;box-shadow:0 6px 20px rgba(59,79,216,.25)}
.lg{display:flex;align-items:center;gap:10px}.lg span{font-size:26px;background:rgba(255,255,255,.2);border-radius:12px;padding:4px 8px}.lg b{font-size:18px;display:block;line-height:1.1}.lg small{opacity:.85;font-size:12px}
header select{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);font-size:13px}header option{color:#1b1f2a}
main{position:relative;margin-top:-16px;padding-bottom:100px}
.card,.k{border:0;border-radius:16px;box-shadow:0 2px 12px rgba(20,30,70,.08);padding:14px}
.k{display:flex;flex-direction:column}.k i{font-style:normal;font-size:20px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pr) 14%,transparent);margin-bottom:8px}.k b{font-size:20px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--cd);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px;overflow:hidden;box-shadow:0 -4px 16px rgba(20,30,70,.1)}
nav button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:6px 2px;color:var(--mu);border-radius:12px}
nav button i{font-style:normal;font-size:20px}
nav button.on{background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr);font-weight:700}
button{border-radius:10px}button.p{background:linear-gradient(135deg,#3b4fd8,#7b3fd1);border:0;color:#fff;font-weight:600;padding:10px 14px}
input,select{padding:10px 12px;border-radius:10px}
header{background:linear-gradient(180deg,#0b1550,#17237a);box-shadow:none}
.lg span{background:none;color:#f5b835;font-size:32px;padding:0}.lg b{font-size:22px}.lg em{font-style:normal;color:#f5b835}.lg small{font-size:11px}
nav{background:#0b1550;border-top:0}nav button{color:#b8c0ff}nav button.on{background:none;color:#f5b835;border-radius:0;box-shadow:inset 0 -3px 0 #f5b835}
button.p{background:#5048e5}
.hero{background:linear-gradient(135deg,#0b1550,#2a2f9a 75%);color:#fff;border-radius:18px;padding:16px;margin-bottom:10px;border:1px solid #3d49c9}.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:6px 0}.tag{background:#f5b835;color:#1b1f2a;border-radius:20px;padding:3px 12px;font-weight:700;font-size:13px}
.row2{display:flex;gap:12px;align-items:center}.row2 i{font-style:normal;font-size:24px;background:color-mix(in srgb,var(--pr) 14%,transparent);border-radius:12px;padding:10px}
.lo{min-height:100vh;background:linear-gradient(180deg,#0b1550,#16226f 60%,#0b1550);color:#fff;padding:36px 16px 24px;box-sizing:border-box}.lh{text-align:center}.lh h1{margin:0;font-size:44px}.lh em{font-style:normal;color:#f5b835}.ft{display:flex;justify-content:space-around;font-size:12px;margin-top:14px;gap:6px}
.sheet{background:var(--cd);color:var(--tx);border-radius:22px;padding:18px;margin-top:18px}.sheet h2{margin:0 0 4px;font-size:26px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin:12px 0}.seg button{flex:1;border:0;background:none;padding:12px}.seg .on{background:#5048e5;color:#fff}
.w{display:block;width:100%;margin:8px 0;box-sizing:border-box;padding:14px;font-size:16px}.o{background:none;border:2px solid #5048e5;color:#5048e5;font-weight:600}.sec{background:var(--bg);border-radius:12px;padding:12px;margin-top:12px}
nav button{color:#e8ebff}nav button i{display:flex}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--cd);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 12px rgba(20,30,70,.08)}.st>div{text-align:center;display:flex;flex-direction:column;gap:2px}.st b{font-size:24px}.st small{color:var(--mu);font-size:12px}
.ic{font-style:normal;font-size:18px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--pr) 14%,transparent);margin:0 auto 4px}.ok2{background:#12805c;color:#fff}.bd2{background:#d93636;color:#fff}
.tb{display:flex;background:var(--cd);border-radius:14px;padding:4px;margin-bottom:10px;gap:4px}.tb button{flex:1;border:0;background:none;padding:12px 4px;font-weight:600;color:var(--pr)}.tb .on{background:var(--pr);color:#fff}
.mr{display:flex;gap:12px;background:var(--cd);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 12px rgba(20,30,70,.08)}.av{flex:none;width:52px;height:52px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700}.mi{flex:1;min-width:0}.mi>b{display:inline-block;max-width:55%}.bg{float:right;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:600}.gr{background:#d8f5e8;color:#12805c}.rd{background:#ffe1e1;color:#c62828}.o2{background:none;border:1px solid var(--pr);color:var(--pr)}
header{background:linear-gradient(180deg,var(--hc,#0b1550),color-mix(in srgb,var(--hc,#0b1550) 82%,#fff))}nav{background:var(--hc,#0b1550)}button.p,.seg .on{background:var(--ac,#5048e5)!important}
@media print{header,nav,.np{display:none}}
</style></head><body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=s=>document.querySelector(s),T=new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const dd=n=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};
function seed(){const m=[['Marie Kasongo','Chorale'],['Jean Mbuyi','Jeunesse'],['Esther Ilunga','Accueil'],['Paul Tshimanga','Jeunesse']].map(([n,d])=>({id:uid(),name:n,dept:d,code:'M'+uid()}));
return{plan:'Gratuit',members:m,svc:[{id:'s1',title:'Culte',date:dd(21),p:[m[0].id,m[1].id,m[2].id]},{id:'s2',title:'Culte',date:dd(14),p:[m[0].id,m[1].id]},{id:'s3',title:'Culte',date:dd(7),p:[m[0].id,m[2].id]}],
tx:[{id:uid(),t:'in',amt:450000,cur:'FC',cat:'Dîmes',fund:'Général',st:'Enregistrée',date:dd(7)},{id:uid(),t:'in',amt:200,cur:'USD',cat:'Offrandes',fund:'Construction',st:'Enregistrée',date:dd(7)},{id:uid(),t:'out',amt:180000,cur:'FC',cat:'Sonorisation',fund:'Général',st:'Soumise',date:dd(2)}],
tasks:[{id:uid(),title:'Préparer la salle',dept:'Jeunesse',due:dd(1),who:'Jean',st:'En cours'},{id:uid(),title:'Confirmer les intervenants',dept:'Jeunesse',due:dd(-5),who:'Esther',st:'À faire'}],
posts:[{id:uid(),txt:'Bienvenue sur ChurchOS ! Culte dimanche à 9h.',date:T}],pr:[]}}
let D;try{D=JSON.parse(localStorage.getItem('cos2'))}catch(e){}
if(!D)D=seed(),mig();
const save=()=>{try{localStorage.setItem('cos2',JSON.stringify(D))}catch(e){}};
const R={'Pasteur':['dash','membres','presence','finances','taches','comm'],'Secrétaire':['dash','membres','presence','taches','comm'],'Trésorier':['dash','finances'],'Président de département':['dash','membres','presence','taches','comm'],'Membre':['comm']};
const L={dash:['🏠','Accueil'],membres:['👥','Membres'],presence:['✅','Présences'],finances:['💰','Finances'],taches:['📋','Tâches'],comm:['💬','Église']};
const FUNDS=['Général','Construction','Social','Évangélisation','Jeunesse'];
let role='Pasteur',tab='dash',cards=false,curSvc=null,q='',scanning=false,stream=null,last='',lastT=0;
const fmt=(v,c)=>v.toLocaleString('fr-FR')+' '+c;
const qr=t=>{try{const x=qrcode(0,'M');x.addData(t);x.make();return x.createSvgTag({cellSize:4,margin:2})}catch(e){return '<i class="mu">QR indisponible</i>'}};
const go=t=>{if(R[role].includes(t)){tab=t;render()}};
function bal(){const o={};D.tx.forEach(x=>{const k=x.fund+'|'+x.cur;o[k]=o[k]||{fund:x.fund,cur:x.cur,v:0,e:0};if(x.t=='in')o[k].v+=x.amt;else if(x.st=='Payée')o[k].v-=x.amt;else if(x.st=='Approuvée')o[k].e+=x.amt});return Object.values(o)}
function absents(){const s=D.svc.slice(-3);if(s.length<3)return[];return D.members.filter(m=>s.every(x=>!x.p.includes(m.id)))}
const svc=()=>D.svc.find(x=>x.id==curSvc)||D.svc.at(-1);
const V={
dash(){const s=D.svc.at(-1),pend=D.tx.filter(x=>x.t=='out'&&['Soumise','Approuvée'].includes(x.st)).length,late=D.tasks.filter(x=>x.st!='Terminée'&&x.due<T).length,pr=D.pr.filter(x=>x.st=='Nouvelle').length,ab=absents().length;
const at=[];if(late)at.push(late+' tâche(s) en retard');if(pend)at.push(pend+' dépense(s) en attente de validation ou de paiement');if(pr&&['Pasteur','Secrétaire'].includes(role))at.push(pr+' demande(s) pastorale(s) en attente');if(ab)at.push(ab+' membre(s) absent(s) aux 3 derniers services : prise de nouvelles à prévoir');
const tot={};bal().forEach(b=>tot[b.cur]=(tot[b.cur]||0)+b.v);
return `<div class="hero"><h2>Bonjour 👋</h2><p>Que la grâce de Dieu soit avec vous aujourd’hui !</p><span class="tag">Message du pasteur</span><p>« Ne nous lassons pas de faire le bien, car nous moissonnerons au temps convenable. »<br><small>Galates 6:9</small></p></div><div class="card row2"><i>📅</i><div><b>Prochain culte</b><br>Dimanche · 08h00 – 11h00</div></div><div class="card row2"><i>📖</i><div><b>Verset du jour</b><br>« Car Dieu n’a pas donné un esprit de timidité, mais un esprit de puissance, d’amour et de sagesse. »<br><small class="mu">2 Timothée 1:7</small></div></div><div class="g"><div class="k" onclick="go('membres')"><i>👥</i><b>${D.members.length}</b><span>Membres</span></div><div class="k" onclick="go('presence')"><i>✅</i><b>${s?s.p.length:'–'}</b><span>Présents au dernier service</span></div><div class="k" onclick="go('finances')"><i>💰</i><b>${Object.entries(tot).map(([c,v])=>fmt(v,c)).join(' · ')||'–'}</b><span>Fonds disponibles</span></div><div class="k" onclick="go('taches')"><i>📋</i><b class="${late?'bad':''}">${late}</b><span>Tâches en retard</span></div></div>
<div class="card" style="margin-top:10px"><b>À surveiller aujourd’hui</b>${D.members.length||D.tx.length?(at.length?'<ul>'+at.map(a=>'<li>'+a+'</li>').join('')+'</ul>':'<p class="mu">Rien d’urgent.</p>'):'<p class="mu">Aucune information enregistrée pour l’instant.</p>'}</div>
<div class="card"><b>Formule de l’église</b> <select onchange="D.plan=this.value;save();render()">${['Gratuit','Standard','Premium'].map(p=>`<option${p==D.plan?' selected':''}>${p}</option>`).join('')}</select><p class="mu">Gratuit : 50 membres · Standard : 500 · Premium : illimité (simulation, sans paiement réel).</p><button onclick="if(confirm('Remettre les données de démonstration ?')){D=seed();mig();save();render()}">Réinitialiser la démo</button></div>`},
membres(){return `<div class="card np"><b>Nouveau membre</b><div class="row"><input id="mn" placeholder="Nom et prénom"><input id="md" placeholder="Département"></div><div class="row"><button class="p" onclick="addM()">Ajouter (code QR automatique)</button><button onclick="cards=!cards;render()">${cards?'Retour à la liste':'Cartes à imprimer'}</button></div></div>`+(cards?`<button class="np" onclick="window.print()">Imprimer</button><div class="cards">${D.members.map(m=>`<div class="card"><div class="qr">${qr('COS:'+m.code)}</div><b>${esc(m.name)}</b><div class="mu">${esc(m.dept)} · ${m.code}</div></div>`).join('')}</div>`:`<div class="card"><input placeholder="Rechercher…" oninput="q=this.value;$('#ml').innerHTML=ml()" value="${esc(q)}"><div id="ml">${ml()}</div></div>`)},
presence(){const s=svc(),ab=absents();return `<div class="card"><b>Service</b><div class="row"><select onchange="curSvc=this.value;render()">${D.svc.map(x=>`<option value="${x.id}"${x.id==s.id?' selected':''}>${esc(x.title)} · ${x.date}</option>`).join('')}</select></div><div class="row"><input id="st" placeholder="Nouveau : Culte, Répétition…"><button onclick="addS()">Créer</button></div></div>
<div class="card"><b>Scanner les cartes</b> <span class="mu">· présents : <span id="cnt">${s.p.length}</span></span><div id="cam"><video id="v" playsinline muted></video><div id="fl">Prêt à scanner</div></div><div class="row"><button class="p" onclick="startScan()">Démarrer la caméra</button><button onclick="stopScan()">Arrêter</button></div><div class="row"><input id="mc" placeholder="Code manuel (ex : MA1B2C3)"><button onclick="hit($('#mc').value)">Valider</button></div></div>
<div class="card"><b>Saisie rapide</b>${D.members.map(m=>`<label style="display:block;padding:4px 0"><input type="checkbox" ${s.p.includes(m.id)?'checked':''} onchange="tog('${m.id}')"> ${esc(m.name)}</label>`).join('')}</div>
<div class="card"><b>Suivi des absences</b>${ab.length?ab.map(m=>`<p>${esc(m.name)} : 3 absences de suite.<br><i class="mu">« Bonjour ${esc(m.name.split(' ')[0])}, nous espérons que tu vas bien. Nous avons pensé à toi et souhaitions prendre de tes nouvelles. Si tu as besoin d’aide ou de prière, nous sommes disponibles. »</i></p>`).join(''):'<p class="mu">Aucune absence répétée.</p>'}</div>`},
finances(){const b=bal();return `<div class="card"><b>Soldes par fonds</b> <span class="mu">(recettes − dépenses payées)</span>${b.length?b.map(x=>`<div>${x.fund} : <b>${fmt(x.v,x.cur)}</b>${x.e?` <span class="wr">(engagé non payé : ${fmt(x.e,x.cur)})</span>`:''}</div>`).join(''):'<p class="mu">Aucune opération.</p>'}</div>
<div class="card"><b>Nouvelle opération</b><div class="row"><select id="ft"><option value="in">Recette</option><option value="out">Dépense (à valider)</option></select><input id="fa" type="number" placeholder="Montant"><select id="fc"><option>FC</option><option>USD</option></select></div><div class="row"><input id="fk" placeholder="Catégorie (dîmes, loyer…)"><select id="ff">${FUNDS.map(f=>`<option>${f}</option>`).join('')}</select></div><div class="row"><button class="p" onclick="addT()">Enregistrer</button></div><p class="mu">Seul le pasteur approuve, seul le trésorier marque « Payée ».</p></div>
<div class="card"><b>Journal</b>${D.tx.slice().reverse().map(x=>`<div style="padding:6px 0;border-top:1px solid var(--bd)">${x.t=='in'?'＋':'－'} <b>${fmt(x.amt,x.cur)}</b> · ${esc(x.cat)} · ${x.fund}<br><span class="mu">${x.date} · ${x.st}</span> ${x.t=='out'&&x.st=='Soumise'&&role=='Pasteur'?`<button onclick="st('${x.id}','Approuvée')">Approuver</button><button onclick="st('${x.id}','Refusée')">Refuser</button>`:''}${x.st=='Approuvée'&&role=='Trésorier'?`<button onclick="st('${x.id}','Payée')">Marquer payée</button>`:''}</div>`).join('')}</div>`},
taches(){const cols=['À faire','En cours','Terminée'];return `<div class="card"><b>Nouvelle tâche</b><div class="row"><input id="tt" placeholder="Titre"><input id="tw" placeholder="Responsable"></div><div class="row"><input id="td" type="date" value="${T}"><button class="p" onclick="addK()">Ajouter</button></div></div><div class="kb">${cols.map((c,i)=>`<div class="card"><b>${c}</b>${D.tasks.filter(x=>x.st==c).map(x=>`<div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:6px">${esc(x.title)}<br><span class="mu">${esc(x.who)} · ${x.due}</span>${x.st!='Terminée'&&x.due<T?' <b class="bad">En retard</b>':''}<br>${i>0?`<button onclick="mv('${x.id}',${i-1})">◀</button>`:''}${i<2?`<button onclick="mv('${x.id}',${i+1})">▶</button>`:''}</div>`).join('')}</div>`).join('')}</div>`},
comm(){const adm=['Pasteur','Secrétaire'].includes(role);return `${adm?`<div class="card"><b>Annonce officielle</b><div class="row"><input id="pt" placeholder="Votre annonce"><div style="flex-basis:100%">Destinataires : <label><input type="checkbox" class="rc" value="all" checked> Toute l’église</label> ${D.depts.map(d=>`<label><input type="checkbox" class="rc" value="${d.id}"> ${esc(d.name)}</label>`).join(' ')}</div><button class="p" onclick="addP()">Publier</button></div></div>`:''}<div class="card"><b>Annonces</b>${D.posts.filter(vis).slice().reverse().map(p=>`<p>${esc(p.txt)}<br><span class="mu">${p.date}</span></p>`).join('')}</div>
<div class="card"><b>Demande de prière ou d’entretien</b><div class="row"><select id="pc"><option>Prière</option><option>Entretien pastoral</option><option>Témoignage</option></select></div><div class="row"><input id="px" placeholder="Votre demande (confidentielle)"><button class="p" onclick="addR()">Envoyer</button></div><p class="mu">Jamais publiée dans le fil. Visible seulement par le pasteur et le secrétaire.</p>${adm?D.pr.map(r=>`<div style="border-top:1px solid var(--bd);padding:6px 0">${esc(r.c)} · ${esc(r.t)} <i class="mu">(${esc(r.by||'')})</i><br><span class="mu">${r.st}</span> ${r.st=='Nouvelle'?`<button onclick="D.pr.find(x=>x.id=='${r.id}').st='En cours';save();render()">Prendre en charge</button>`:''}</div>`).join(''):''}</div>
<div class="card"><b>Réunion audio d’un département</b><div class="row"><input id="jr" placeholder="Nom du département"><button class="p" onclick="jit()">Créer le lien</button></div><div id="jl" class="mu">Audio seul, sans vidéo (service Jitsi, gratuit).</div></div>`}};
const ml=()=>{const f=D.members.filter(m=>(m.name+m.dept).toLowerCase().includes(q.toLowerCase())&&(['Pasteur','Secrétaire'].includes(role)||m.did==me.did));return f.length?f.map(m=>`<details><summary>${esc(m.name)} <span class="mu">· ${esc(m.dept)}</span></summary><div class="qr">${qr('COS:'+m.code)}</div><span class="mu">Code : ${m.code}</span></details>`).join(''):'<p class="mu">Aucun membre.</p>'};

const VS=[['Car Dieu a tant aimé le monde qu’il a donné son Fils unique.','Jean 3:16'],['L’Éternel est mon berger : je ne manquerai de rien.','Psaume 23:1'],['Je puis tout par celui qui me fortifie.','Philippiens 4:13'],['Cherchez premièrement le royaume et la justice de Dieu.','Matthieu 6:33'],['Fortifie-toi et prends courage, car l’Éternel ton Dieu est avec toi.','Josué 1:9'],['Priez sans cesse.','1 Thessaloniciens 5:17'],['Ta parole est une lampe à mes pieds.','Psaume 119:105']];
const CH=['Lisez un chapitre de la Bible aujourd’hui.','Priez 10 minutes pour quelqu’un de votre église.','Écrivez trois sujets de reconnaissance.','Écoutez une prédication.','Envoyez un mot d’encouragement à un frère ou une sœur.','Méditez un verset et notez une question.','Pardonnez, ou demandez pardon, à quelqu’un.'];
function daily(){const d=Math.floor(Date.now()/864e5),v=VS[d%7];return `<div class="card"><b>📖 Verset du jour</b><p>« ${v[0]} »<br><span class="mu">${v[1]}</span></p></div><div class="card"><b>🎯 Défi du jour</b><p>${CH[d%7]}</p><button class="p" onclick="tab='croiss';ct='q';qz={i:0,s:0};render()">Faire le quiz biblique</button></div>${D.tip?`<div class="card"><b>💡 Conseil biblique</b><p>${esc(D.tip)}</p></div>`:''}${(D.tem||[]).length?`<div class="card"><b>🕊 Témoignages</b>${D.tem.slice().reverse().map(t=>`<p>« ${esc(t.t)} »<br><span class="mu">${t.d}</span></p>`).join('')}</div>`:''}`}
function ph(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);me.ph=c.toDataURL('image/jpeg',.8);save();render()};im.src=r.result};r.readAsDataURL(f)}
function setC(c){me.col=c;save();render()}
function chP(){const p=$('#np').value;if(p.length<4)return er('Au moins 4 caractères');me.pw=p;save();er('✔ Mot de passe changé')}
V.profil=()=>`<div class="card" style="text-align:center"><div style="display:flex;justify-content:center">${avt(me,90)}</div><h3 style="margin:8px 0 0">${esc(me.name)}</h3><span class="mu">${esc(me.title)}${me.dept?' · '+esc(me.dept):''}</span><div class="row" style="justify-content:center"><label class="mu">📷 Changer ma photo <input type="file" accept="image/*" onchange="ph(this)" hidden></label></div></div><div class="card"><b>🎨 Ma couleur</b><div class="row"><input type="color" value="${me.col||'#0b1550'}" onchange="setC(this.value)" style="width:60px;height:44px;padding:2px"><button onclick="setC('')">Couleur par défaut</button></div></div><div class="card"><b>🔑 Mot de passe</b><div class="row"><input id="np" type="password" placeholder="Nouveau mot de passe"><button class="p" onclick="chP()">Changer</button></div><div id="er" class="mu"></div></div>`;
V.signal=()=>`<div class="card"><b>🚨 Signaler un problème</b><p class="mu">Par écrit ou par message vocal. Votre message arrive à la personne désignée pour vous répondre.</p><div class="row"><select id="pc"><option>Problème</option><option>Requête</option><option>Suggestion</option><option>Demande de prière</option><option>Témoignage</option></select></div><div class="row"><input id="px" placeholder="Écrivez ici (confidentiel)"></div><div class="row"><button onclick="mic()">🎙 Message vocal (enregistrer / arrêter)</button></div><div id="ms" class="mu"></div><label class="mu"><input type="checkbox" id="pa"> Envoyer sans mon nom</label><div class="row"><button class="p" onclick="addR()">Envoyer</button></div></div><div class="card"><b>Mes messages</b>${D.pr.filter(r=>r.by==me.name).slice().reverse().map(r=>`<div style="border-top:1px solid var(--bd);padding:8px 0">${esc(r.c)} · <b>${r.st}</b><br><span class="ok">✔ Merci, nous avons bien reçu votre message.</span>${r.to?' Suivi par '+esc(nm(r.to))+'.':''}${r.rp||r.ra?`<br><b>Réponse :</b> ${esc(r.rp||'')}${r.ra?`<br><audio controls src="${r.ra}"></audio>`:''}`:''}</div>`).join('')||'<p class="mu">Aucun message.</p>'}</div>`;
const v2=V.dept;V.dept=()=>(!['Pasteur','Secrétaire'].includes(role)&&!me.did)?nod():v2();
let rm='m';
function regv(){$('#app').innerHTML=`<div class="lo"><div class="lh"><h1>Church<em>OS</em></h1></div><div class="sheet"><h2>Créer un compte</h2><div class="seg"><button class="${rm=='m'?'on':''}" onclick="rm='m';regv()">Je suis membre</button><button class="${rm=='n'?'on':''}" onclick="rm='n';regv()">Nouveau membre</button></div><input id="rn" class="w" placeholder="Nom et prénom (comme dans la base de l’église)">${rm=='m'?`<input id="re" class="w" autocapitalize="none" placeholder="E-mail ou identifiant"><input id="rp" class="w" type="password" placeholder="Choisissez un mot de passe">`:`<input id="rt2" class="w" placeholder="Numéro de téléphone">`}<div id="er" class="bad"></div><button class="p w" onclick="regOk()">${rm=='m'?'Créer mon compte':'Envoyer ma demande'}</button><button class="w o" onclick="rg=false;login()">Retour</button><p class="mu">${rm=='m'?'Votre nom doit figurer dans la base de l’église.':'Un responsable vous ajoutera à la base de l’église, puis vous pourrez créer votre compte.'}</p></div></div>`}
function regOk(){const n=$('#rn').value.trim();if(!n)return er('Écrivez votre nom');if(rm=='n'){D.pr.push({id:uid(),c:'Nouveau membre',t:n+' · '+($('#rt2').value||'sans numéro'),by:n,st:'Nouvelle',to:pick(),at:Date.now(),nv:true});save();$('#app').innerHTML=`<div class="lo"><div class="sheet"><h2>Merci !</h2><p>Votre demande est envoyée. Un responsable vous ajoutera à la base de l’église. Revenez ensuite créer votre compte.</p><button class="p w" onclick="rg=false;login()">Retour</button></div></div>`;return}const l=$('#re').value.trim().toLowerCase(),p=$('#rp').value,m=D.members.find(x=>x.name.toLowerCase()==n.toLowerCase()&&!x.pw);if(!l||!p)return er('Remplissez tous les champs');if(!m)return er('Ce nom n’est pas dans la base de l’église, ou le compte existe déjà. Contactez votre responsable.');if(D.members.some(x=>x.login==l))return er('Cet identifiant est déjà pris');m.login=l;m.pw=p;save();me=m;role=effRole(m);logged=true;rg=false;tab='dash';render()}
render();
</script></body></html>
