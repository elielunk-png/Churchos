</head><body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=s=>document.querySelector(s),T=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const dd=n=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};
function seed(){const m=[['Marie Kasongo','Chorale'],['Jean Mbuyi','Jeunesse'],['Esther Ilunga','Accueil'],['Paul Tshimanga','Jeunesse']].map(([n,d])=>({id:uid(),name:n,dept:d,code:'M'+uid()}));
return{plan:'Gratuit',members:m,svc:[{id:'s1',title:'Culte',date:dd(21),p:[m[0].id,m[1].id,m[2].id]},{id:'s2',title:'Culte',date:dd(14),p:[m[0].id,m[1].id]},{id:'s3',title:'Culte',date:dd(7),p:[m[0].id,m[2].id]}],
tx:[{id:uid(),t:'in',amt:450000,cur:'FC',cat:'Dîmes',fund:'Général',st:'Enregistrée',date:dd(7)},{id:uid(),t:'in',amt:200,cur:'USD',cat:'Offrandes',fund:'Construction',st:'Enregistrée',date:dd(7)},{id:uid(),t:'out',amt:180000,cur:'FC',cat:'Sonorisation',fund:'Général',st:'Soumise',date:dd(2)}],
tasks:[{id:uid(),title:'Préparer la salle',dept:'Jeunesse',due:dd(1),who:'Jean',st:'En cours'},{id:uid(),title:'Confirmer les intervenants',dept:'Jeunesse',due:dd(-5),who:'Esther',st:'À faire'}],
posts:[{id:uid(),txt:'Bienvenue sur ChurchOS ! Culte dimanche à 9h.',date:T}],pr:[]}}
let D;try{D=JSON.parse(localStorage.getItem('cos2'))}catch(e){}
if(!D)D=seed(),mig();
const save=()=>{try{localStorage.setItem('cos2',JSON.stringify(D));window.qb&&qb('');window.cloudPush&&cloudPush()}catch(e){window.qb&&qb('⚠ Stockage plein : vos dernières données ne sont pas enregistrées. Exportez une sauvegarde (Profil) puis supprimez des messages vocaux.')}};
const R={'Pasteur':['dash','membres','presence','finances','taches','comm'],'Secrétaire':['dash','membres','presence','taches','comm'],'Trésorier':['dash','finances'],'Président de département':['dash','membres','presence','taches','comm'],'Membre':['comm']};
const L={dash:['🏠','Accueil'],membres:['👥','Membres'],presence:['✅','Présences'],finances:['💰','Finances'],taches:['📋','Tâches'],comm:['💬','Église']};
const FUNDS=['Général','Construction','Social','Évangélisation','Jeunesse'];
let role='Pasteur',tab='dash',cards=false,curSvc=null,q='',scanning=false,stream=null,last='',lastT=0;
const fmt=(v,c)=>v.toLocaleString('fr-FR')+' '+c;
const qr=t=>{try{const x=qrcode(0,'M');x.addData(t);x.make();return x.createSvgTag({cellSize:4,margin:2})}catch(e){return '<i class="mu">QR indisponible</i>'}};
const go=t=>{if(R[role].includes(t)){tab=t;render()}};
function bal(){const o={};D.tx.forEach(x=>{const k=x.fund+'|'+x.cur;o[k]=o[k]||{fund:x.fund,cur:x.cur,v:0,e:0};if(x.t=='in')o[k].v+=x.amt;else if(x.st=='Payée')o[k].v-=x.amt;else if(x.st=='Approuvée')o[k].e+=x.amt});return Object.values(o)}
function absents(){const s=D.svc.slice(-3);if(s.length<3)return[];return D.members.filter(m=>s.every(x=>!x.p.includes(m.id)))}
const svc=()=>D.svc.find(x=>x.id==curSvc)||D.svc.at(-1);
const V={
dash(){const s=D.svc.at(-1),pend=D.tx.filter(x=>x.t=='out'&&['Soumise','Approuvée'].includes(x.st)).length,late=D.tasks.filter(x=>x.st!='Terminée'&&x.due<T).length,pr=D.pr.filter(x=>x.st=='Nouvelle').length,ab=absents().length;
const at=[];if(late)at.push(late+' tâche(s) en retard');if(pend)at.push(pend+' dépense(s) en attente de validation ou de paiement');if(pr&&['Pasteur','Secrétaire'].includes(role))at.push(pr+' demande(s) pastorale(s) en attente');if(ab)at.push(ab+' membre(s) absent(s) aux 3 derniers services : prise de nouvelles à prévoir');
const tot={};bal().forEach(b=>tot[b.cur]=(tot[b.cur]||0)+b.v);
return `<div class="hero"><h2>Bonjour 👋</h2><p>Que la grâce de Dieu soit avec vous aujourd’hui !</p><span class="tag">Message du pasteur</span><p>« Ne nous lassons pas de faire le bien, car nous moissonnerons au temps convenable. »<br><small>Galates 6:9</small></p></div><div class="card row2"><i>📅</i><div><b>Prochain culte</b><br>Dimanche · 08h00 – 11h00</div></div><div class="card row2"><i>📖</i><div><b>Verset du jour</b><br>« Car Dieu n’a pas donné un esprit de timidité, mais un esprit de puissance, d’amour et de sagesse. »<br><small class="mu">2 Timothée 1:7</small></div></div><div class="g"><div class="k" onclick="go('membres')"><i>👥</i><b>${D.members.length}</b><span>Membres</span></div><div class="k" onclick="go('presence')"><i>✅</i><b>${s?s.p.length:'–'}</b><span>Présents au dernier service</span></div><div class="k" onclick="go('finances')"><i>💰</i><b>${Object.entries(tot).map(([c,v])=>fmt(v,c)).join(' · ')||'–'}</b><span>Fonds disponibles</span></div><div class="k" onclick="go('taches')"><i>📋</i><b class="${late?'bad':''}">${late}</b><span>Tâches en retard</span></div></div>
<div class="card" style="margin-top:10px"><b>À surveiller aujourd’hui</b>${D.members.length||D.tx.length?(at.length?'<ul>'+at.map(a=>'<li>'+a+'</li>').join('')+'</ul>':'<p class="mu">Rien d’urgent.</p>'):'<p class="mu">Aucune information enregistrée pour l’instant.</p>'}</div>
<div class="card"><b>Formule de l’église</b> <select onchange="D.plan=this.value;save();render()">${['Gratuit','Standard','Premium'].map(p=>`<option${p==D.plan?' selected':''}>${p}</option>`).join('')}</select><p class="mu">Gratuit : 50 membres · Standard : 500 · Premium : illimité (simulation, sans paiement réel).</p><button onclick="if(confirm('Remettre les données de démonstration ?')){D=seed();mig();save();render()}">Réinitialiser la démo</button></div>`},
membres(){return `<div class="card np"><b>Nouveau membre</b><div class="row"><input id="mn" placeholder="Nom et prénom"><input id="md" placeholder="Département"></div><div class="row"><button class="p" onclick="addM()">Ajouter (code QR automatique)</button><button onclick="cards=!cards;render()">${cards?'Retour à la liste':'Cartes à imprimer'}</button></div></div>`+(cards?`<button class="np" onclick="window.print()">Imprimer</button><div class="cards">${D.members.map(m=>`<div class="card"><div class="qr">${qr('COS:'+m.code)}</div><b>${esc(m.name)}</b><div class="mu">${esc(m.dept)} · ${m.code}</div></div>`).join('')}</div>`:`<div class="card"><input placeholder="Rechercher…" oninput="q=this.value;$('#ml').innerHTML=ml()" value="${esc(q)}"><div id="ml">${ml()}</div></div>`)},
presence(){const s=svc(),ab=absents();return `<div class="card"><b>Service</b><div class="row"><select onchange="curSvc=this.value;render()">${D.svc.map(x=>`<option value="${x.id}"${x.id==s.id?' selected':''}>${esc(x.title)} · ${x.date}</option>`).join('')}</select></div><div class="row"><input id="st" placeholder="Nouveau : Culte, Répétition…"><button onclick="addS()">Créer</button></div></div>
<div class="card"><b>Scanner les cartes</b> <span class="mu">· présents : <span id="cnt">${s.p.length}</span></span><div id="cam"><video id="v" playsinline muted></video><div id="fl">Prêt à scanner</div></div><div class="row"><button class="p" onclick="startScan()">Démarrer la caméra</button><button onclick="stopScan()">Arrêter</button></div><div class="row"><input id="mc" placeholder="Code manuel (ex : MA1B2C3)"><button onclick="hit($('#mc').value)">Valider</button></div></div>
<div class="card"><b>Saisie rapide</b>${D.members.map(m=>`<label style="display:block;padding:4px 0"><input type="checkbox" ${s.p.includes(m.id)?'checked':''} onchange="tog('${m.id}')"> ${esc(m.name)}</label>`).join('')}</div>
<div class="card"><b>Suivi des absences</b>${ab.length?ab.map(m=>`<p>${esc(m.name)} : 3 absences de suite.<br><i class="mu">« Bonjour ${esc(m.name.split(' ')[0])}, nous espérons que tu vas bien. Nous avons pensé à toi et souhaitions prendre de tes nouvelles. Si tu as besoin d’aide ou de prière, nous sommes disponibles. »</i></p>`).join(''):'<p class="mu">Aucune absence répétée.</p>'}</div>`},
finances(){const b=bal();return `<div class="card"><b>Soldes par fonds</b> <span class="mu">(recettes − dépenses payées)</span>${b.length?b.map(x=>`<div>${x.fund} : <b>${fmt(x.v,x.cur)}</b>${x.e?` <span class="wr">(engagé non payé : ${fmt(x.e,x.cur)})</span>`:''}</div>`).join(''):'<p class="mu">Aucune opération.</p>'}</div>
<div class="card"><b>Nouvelle opération</b><div class="row"><select id="ft"><option value="in">Recette</option><option value="out">Dépense (à valider)</option></select><input id="fa" type="number" placeholder="Montant"><select id="fc"><option>FC</option><option>USD</option></select></div><div class="row"><input id="fk" placeholder="Catégorie (dîmes, loyer…)"><select id="ff">${FUNDS.map(f=>`<option>${f}</option>`).join('')}</select></div><div class="row"><button class="p" onclick="addT()">Enregistrer</button></div><p class="mu">Seul le pasteur approuve, seul le trésorier marque « Payée ».</p></div>
<div class="card"><b>Journal</b>${D.tx.slice().reverse().map(x=>`<div style="padding:6px 0;border-top:1px solid var(--bd)">${x.t=='in'?'＋':'－'} <b>${fmt(x.amt,x.cur)}</b> · ${esc(x.cat)} · ${x.fund}<br><span class="mu">${x.date} · ${x.st}</span> ${x.t=='out'&&x.st=='Soumise'&&role=='Pasteur'?`<button onclick="st('${x.id}','Approuvée')">Approuver</button><button onclick="st('${x.id}','Refusée')">Refuser</button>`:''}${x.st=='Approuvée'&&role=='Trésorier'?`<button onclick="st('${x.id}','Payée')">Marquer payée</button>`:''}</div>`).join('')}</div>`},
taches(){const cols=['À faire','En cours','Terminée'];return `<div class="card"><b>Nouvelle tâche</b><div class="row"><input id="tt" placeholder="Titre"><input id="tw" placeholder="Responsable"></div><div class="row"><input id="td" type="date" value="${T}"><button class="p" onclick="addK()">Ajouter</button></div></div><div class="kb">${cols.map((c,i)=>`<div class="card"><b>${c}</b>${D.tasks.filter(x=>x.st==c).map(x=>`<div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:6px">${esc(x.title)}<br><span class="mu">${esc(x.who)} · ${x.due}</span>${x.st!='Terminée'&&x.due<T?' <b class="bad">En retard</b>':''}<br>${i>0?`<button onclick="mv('${x.id}',${i-1})">◀</button>`:''}${i<2?`<button onclick="mv('${x.id}',${i+1})">▶</button>`:''}</div>`).join('')}</div>`).join('')}</div>`},
comm(){const adm=['Pasteur','Secrétaire'].includes(role);return `${adm?`<div class="card"><b>Annonce officielle</b><div class="row"><input id="pt" placeholder="Votre annonce"><div style="flex-basis:100%">Destinataires : <label><input type="checkbox" class="rc" value="all" checked> Toute l’église</label> ${D.depts.map(d=>`<label><input type="checkbox" class="rc" value="${d.id}"> ${esc(d.name)}</label>`).join(' ')}</div><button class="p" onclick="addP()">Publier</button></div></div>`:''}<div class="card"><b>Annonces</b>${D.posts.filter(vis).slice().reverse().map(p=>`<p>${esc(p.txt)}<br><span class="mu">${p.date}</span></p>`).join('')}</div>
<div class="card"><b>Demande de prière ou d’entretien</b><div class="row"><select id="pc"><option>Prière</option><option>Entretien pastoral</option><option>Témoignage</option></select></div><div class="row"><input id="px" placeholder="Votre demande (confidentielle)"><button class="p" onclick="addR()">Envoyer</button></div><p class="mu">Jamais publiée dans le fil. Visible seulement par le pasteur et le secrétaire.</p>${adm?D.pr.map(r=>`<div style="border-top:1px solid var(--bd);padding:6px 0">${esc(r.c)} · ${esc(r.t)} <i class="mu">(${esc(r.by||'')})</i><br><span class="mu">${r.st}</span> ${r.st=='Nouvelle'?`<button onclick="D.pr.find(x=>x.id=='${r.id}').st='En cours';save();render()">Prendre en charge</button>`:''}</div>`).join(''):''}</div>
<div class="card"><b>Réunion audio d’un département</b><div class="row"><input id="jr" placeholder="Nom du département"><button class="p" onclick="jit()">Créer le lien</button></div><div id="jl" class="mu">Audio seul, sans vidéo (service Jitsi, gratuit).</div></div>`}};
const ml=()=>{const f=D.members.filter(m=>(m.name+m.dept).toLowerCase().includes(q.toLowerCase())&&(['Pasteur','Secrétaire'].includes(role)||m.did==me.did));return f.length?f.map(m=>`<details><summary>${esc(m.name)} <span class="mu">· ${esc(m.dept)}</span></summary><div class="qr">${qr('COS:'+m.code)}</div><span class="mu">Code : ${m.code} · Identifiant : ${esc(m.login||'pas encore de compte')}</span></details>`).join(''):'<p class="mu">Aucun membre.</p>'};
function render(){stopScan();if(!logged)return login();applyTheme();MB.splice(0,9,...(role=='Membre'?['dash','croiss','signal','dept']:['dash','membres','presence','dept']));const t=tabsOf();if(!t.includes(tab)&&tab!='plus')tab=t[0];$('#app').innerHTML=`<header><div class="lg">${tab=='presence'?`<span>🗓</span><div><b>Présences</b><small>${esc(svc().title)}</small></div>`:`<span>⛪</span><div><b>Church<em>OS</em></b><small>Une église connectée<br>pour un même objectif</small></div>`}</div><div style="display:flex;gap:8px;align-items:center"><div style="text-align:right;font-size:12px">${esc(me.name)}<br>${esc(me.title)} · <a href="#" onclick="logged=false;me=null;render();return false" style="color:#f5b835">Quitter</a></div><span onclick="tab='profil';render()">${avt(me,38)}</span></div></header><nav>${NB(t)}</nav><main>${V[tab]()}</main>`}
function addM(){const n=$('#mn').value.trim();if(!n)return;const lim={Gratuit:50,Standard:500,Premium:1e9}[D.plan];if(D.members.length>=lim)return alert('Limite de la formule '+D.plan+' atteinte ('+lim+' membres). Passez à une formule supérieure.');const d=D.members.find(x=>x.name.toLowerCase()==n.toLowerCase());if(d&&!confirm('Doublon possible : '+d.name+'. Ajouter quand même ?'))return;D.members.push({id:uid(),name:n,dept:$('#md').value,code:'M'+uid()});save();render()}
function addS(){const t=$('#st').value.trim()||'Culte',id=uid();D.svc.push({id,title:t,date:T,p:[]});curSvc=id;save();render()}
function tog(id){const s=svc(),i=s.p.indexOf(id);i<0?s.p.push(id):s.p.splice(i,1);save();$('#cnt').textContent=s.p.length}
function addT(){const a=+$('#fa').value;if(!a||a<=0)return;D.tx.push({id:uid(),t:$('#ft').value,amt:a,cur:$('#fc').value,cat:$('#fk').value||'Divers',fund:$('#ff').value,st:$('#ft').value=='in'?'Enregistrée':'Soumise',date:T});save();render()}
function st(id,s){D.tx.find(x=>x.id==id).st=s;save();render()}
function addK(){const t=$('#tt').value.trim();if(!t)return;D.tasks.push({id:uid(),title:t,dept:'',who:$('#tw').value,due:$('#td').value,st:'À faire'});save();render()}
function mv(id,i){D.tasks.find(x=>x.id==id).st=['À faire','En cours','Terminée'][i];save();render()}
function addP(){const t=$('#pt').value.trim();if(!t)return;const to=[...document.querySelectorAll('.rc:checked')].map(c=>c.value);D.posts.push({id:uid(),txt:t,date:T,by:me.id,to:to.includes('all')||!to.length?'all':to});save();render()}
function addR(){const t=$('#px').value.trim();if(!t)return;D.pr.push({id:uid(),c:$('#pc').value,t,st:'Nouvelle',by:$('#pa')&&$('#pa').checked?'Anonyme':me.name});save();alert('Demande reçue. Merci, quelqu’un reviendra vers vous.');render()}
function jit(){const n=($('#jr').value||'reunion').toLowerCase().replace(/[^a-z0-9]/g,'');const u='https://meet.jit.si/ChurchOS-'+n+'-'+uid()+'#config.startWithVideoMuted=true&config.startAudioOnly=true';$('#jl').innerHTML=`<a href="${u}" target="_blank" rel="noopener">Rejoindre la réunion audio</a><br>${u.split('#')[0]}`}
function flash(t,c){const f=$('#fl');if(f){f.textContent=t;f.style.background=c}}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}}
function hit(raw){const code=String(raw).trim().replace(/^COS:/,'').toUpperCase(),m=D.members.find(x=>x.code==code),s=svc();
if(!m)return flash('✖ Code inconnu','#c62828');if(s.p.includes(m.id))return flash('⚠ Déjà enregistré : '+m.name,'#b26a00');
s.p.push(m.id);save();beep();flash('✔ '+m.name,'#12805c');const c=$('#cnt');if(c)c.textContent=s.p.length;if($('#ps'))rf()}
async function startScan(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#v');v.srcObject=stream;await v.play();scanning=true;loop()}catch(e){flash('Caméra indisponible : utilisez le code manuel','#c62828')}}
function stopScan(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
function loop(){if(!scanning)return;const v=$('#v');if(v&&v.readyState===4&&window.jsQR){const w=360,h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r&&r.data&&(r.data!=last||Date.now()-lastT>2500)){last=r.data;lastT=Date.now();hit(r.data)}}requestAnimationFrame(loop)}
let me=null,curD=null;
function mig(){D.depts=[{id:'d1',name:'Jeunesse',goal:'Former et mobiliser les jeunes'},{id:'d2',name:'Chorale',goal:'Conduire la louange'},{id:'d3',name:'Accueil',goal:'Bien accueillir chaque personne'}];D.chat={};D.summ=[];const s={'Marie Kasongo':['Secrétaire général','d2','marie'],'Jean Mbuyi':['Président','d1','jean'],'Esther Ilunga':['Membre','d3','esther'],'Paul Tshimanga':['Membre','d1','paul']};D.members.forEach(m=>{const a=s[m.name]||['Membre','d1',m.name.split(' ')[0].toLowerCase()];m.title=a[0];m.did=a[1];m.dept=D.depts.find(d=>d.id==a[1]).name;m.login=a[2];m.pw='1234'});[['Pasteur Principal','Pasteur','pasteur'],['Grâce Mbuyi','Trésorier','tresor']].forEach(([n,t,l])=>{const m={id:uid(),name:n,dept:'',did:'',title:t,login:l,pw:'1234',code:'M'+uid()};D.members.push(m);D.svc.forEach(v=>v.p.push(m.id))});D.posts.forEach(p=>p.to='all')}
const roleOf=t=>/pasteur/i.test(t)?'Pasteur':/secr/i.test(t)?'Secrétaire':/tr[ée]sor/i.test(t)?'Trésorier':/pr[ée]sident|vice/i.test(t)?'Président de département':'Membre';
const vis=p=>p.to=='all'||role=='Pasteur'||p.by==me.id||(p.to||[]).includes(me.did);
const cd=()=>D.depts.find(x=>x.id==(['Pasteur','Secrétaire'].includes(role)?(curD||D.depts[0].id):me.did))||D.depts[0];

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCDd4PKFRNYfnaa4WGVElGhZjHL3EkWbQ",
  authDomain: "churchos-de18f.firebaseapp.com",
  projectId: "churchos-de18f",
  storageBucket: "churchos-de18f.firebasestorage.app",
  messagingSenderId: "282288058375",
  appId: "1:282288058375:web:2c187174674580fe943aa2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const CL = Math.random().toString(36).slice(2);
let cid = null, ref = null, timer = null, lastJson = '', ready = false;

const status = t => {
  window.cloudStatus = t;
  const e = document.getElementById('cst');
  if (e) e.textContent = t;
};

async function login() {
  if (ready) return true;
  try { await signInAnonymously(auth); ready = true; return true; }
  catch (e) { status('Connexion cloud impossible : ' + (e.code || e.message)); return false; }
}

function apply(d) {
  if (!d || !d.json || d.json === lastJson) return;
  lastJson = d.json;
  try { window.cloudApply(JSON.parse(d.json)); status('Synchronisé ✔'); }
  catch (e) { status('Données distantes illisibles'); }
}

async function push() {
  if (!ref) return;
  const j = JSON.stringify(window.cloudGet());
  if (j === lastJson) return;
  if (new Blob([j]).size > 900000) {
    status('⚠ Données trop volumineuses (limite 1 Mo) : synchronisation suspendue. Retirez des messages vocaux ou des photos.');
    return;
  }
  try {
    lastJson = j;
    await setDoc(ref, { json: j, by: CL, t: Date.now() });
    status('Synchronisé ✔');
  } catch (e) { lastJson = ''; status('Envoi impossible : ' + (e.code || e.message)); }
}

window.cloudPush = () => {
  if (!ref) return;
  clearTimeout(timer);
  timer = setTimeout(push, 1500);
};

async function attach(c) {
  if (!(await login())) return;
  cid = c;
  ref = doc(db, 'churches', cid);
  try {
    const snap = await getDoc(ref);
    if (snap.exists()) apply(snap.data()); else await push();
    onSnapshot(ref, s => { if (s.exists() && s.data().by !== CL) apply(s.data()); });
  } catch (e) { status('Lecture impossible : ' + (e.code || e.message)); }
}

window.cloudEnable = async () => {
  if (localStorage.getItem('cos_cid')) return;
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  const c = Array.from(a, x => x.toString(36).padStart(2, '0')).join('');
  localStorage.setItem('cos_cid', c);
  await attach(c);
  render();
};

window.cloudShare = async () => {
  if (!cid) return;
  if (location.protocol === 'file:') {
    alert('Le lien ne fonctionnera que lorsque l’application sera hébergée en ligne (Firebase Hosting).');
    return;
  }
  const url = location.origin + location.pathname + '?e=' + cid;
  try { if (navigator.share) { await navigator.share({ title: 'ChurchOS', url }); return; } } catch (e) {}
  try { await navigator.clipboard.writeText(url); status('Lien copié ✔'); }
  catch (e) { prompt('Copiez ce lien :', url); }
};

(async function start() {
  const p = new URLSearchParams(location.search);
  const j = p.get('e');
  if (j && /^[a-z0-9]{20,64}$/.test(j)) {
    localStorage.setItem('cos_cid', j);
    history.replaceState(null, '', location.pathname);
  }
  const c = localStorage.getItem('cos_cid');
  if (c) attach(c);
})();
</script>
